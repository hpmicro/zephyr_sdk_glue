description: HPMicro HPM MIPI-DSI

compatible: "hpmicro,hpm-mipi-dsi"

include: ["base.yaml"]

properties:
  endpoint_in:
      type: phandle
      required: true
      description: video data source of the mipi-dsi
  id:
    type: int
    required: true
    description: mipi dsi instance number
  mipi_dsi_phy:
    type: phandle
    required: true
    description: mipi dsi phy node
  pixelmux:
    type: phandle
    required: true
    description: pixelmux node
