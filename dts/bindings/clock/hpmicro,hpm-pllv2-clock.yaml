description: HPMicro PLL version 2.

compatible: "hpmicro,hpm-pllv2-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  pll-frequency:
    type: int
    required: true
    description: |
      PLL frequency Hz

  pll-index:
    type: int
    required: true
    description: |
      PLL index
    enum:
      - 0
      - 1
      - 2
      - 3
      - 4

  "#clock-cells":
    const: 2

clock-cells:
  - clk-index
  - div

child-binding:
  description: |
    PLL division

  properties:
    src-name:
      type: int
      required: true
      description: |
        PLL divider node index

    div-i:
      type: int
      required: true
      description: |
        PLL divider index

    div-p:
      type: int
      required: true
      description: |
        PLL divider prescaler, freq = VCO / (1 + div-p / 5)
