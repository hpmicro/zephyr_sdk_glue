# The west manifest file (west.yml) for the hpmicro SDK.
#
# Get sources from gitee
#

########################################
##  zephyr                    v4.4.0  ##
##  hpm_sdk                   v1.13.0 ##
########################################
manifest:
  version: "1.0"

  remotes:
    - name: test
      url-base: git@192.168.11.211:oss
    - name: gitee
      url-base: https://gitee.com/hpmicro
    - name: cherry-embedded
      url-base: https://gitee.com/sakumisu
    - name: gitee-zephyr
      url-base: https://gitee.com/zephyr-rtos
    - name: sw
      url-base: git@192.168.11.211:sw

  defaults:
    remote: gitee

  projects:
    - name: zephyr
      repo-path: zephyr
      revision: zsg_v0.8.0
      import:
        name-allowlist:
          - west-commands
    - name: sdk_env
      repo-path: sdk_env
      path: sdk_env
      revision: v1.13.0
      submodules: true
    - name: canopennode
      repo-path: canopennode
      path: modules/lib/canopennode
      revision: dec12fa3f0d790cafa8414a4c2930ea71ab72ffd
    - name: lvgl
      repo-path: zephyr_lvgl
      path: modules/lib/gui/lvgl
      revision: 85aa60d18b3d5e5588d7b247abf90198f07c8a63
    - name: CherryUSB
      remote: cherry-embedded
      repo-path: CherryUSB
      path: modules/lib/CherryUSB
      revision: 4b830cf6bf804542cdd0cf14dd010fddeb990f8b
    - name: fatfs
      repo-path: fatfs
      path: modules/fs/fatfs
      revision: 42c2d6ee77e108d2a6d05e862ef0be23511db204
    - name: mcuboot
      repo-path: mcuboot
      revision: 5af38164715eb75b4319588f6a41d71466e7060a
      path: bootloader/mcuboot
    - name: mbedtls
      repo-path: mbedtls
      revision: a3e190fe44c78d1ba67f55979e1257328cc7d0d8
      path: modules/crypto/mbedtls
      groups:
        - crypto
      remote: gitee-zephyr
    - name: tf-psa-crypto
      repo-path: tf-psa-crypto
      revision: dc575a2ddcc8cb16275d24c42a52eaf79ebe2231
      path: modules/crypto/tf-psa-crypto
      groups:
        - crypto

  # West-related configuration for the sdk_glue repository.
  self:
    path: sdk_glue
    west-commands: scripts/west-commands.yml
