sample:
  name: Blink LED (PWM based)
tests:
  hpmicro.sample.basic.blinky_pwm:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
      - PWM-based blinky
      - Calibrating for channel [0-9]+
      - Done calibrating; maximum/minimum periods [0-9]+/[0-9]+ nsec
      - Using period [0-9]+
      - Using period [0-9]+
    tags:
    - hpmicro_verified
    - pwm
    depends_on:
    - pwm
    filter: dt_alias_exists("pwm-led0") and dt_compat_enabled("pwm-leds")
    required_snippets:
    - blinky_pwm
    platform_allow: &platforms
    - hpm5100evk
    - hpm5300evk
    - hpm5e00evk
    - hpm6200evk
    - hpm6300evk
    - hpm6750evk2
    - hpm6e00evk
    - hpm6p00evk
    integration_platforms: *platforms
