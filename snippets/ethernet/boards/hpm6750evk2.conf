# hpm6750evk2 has two ethernet ports:
#   - eth0: RGMII / GbE  / RTL8211
#   - eth1: RMII  / 100M / RTL8201
# The driver supports ONE interface type per build, so pick one.
#
# Default: GbE (eth0)
CONFIG_ETH_HPM_RGMII=y

# 100M (eth1) - uncomment and rebuild to use the RMII port instead
#CONFIG_ETH_HPM_RMII=y
