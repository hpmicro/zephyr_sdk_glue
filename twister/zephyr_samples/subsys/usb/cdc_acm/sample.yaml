sample:
  name: CDC ACM USB
tests:
  hpmicro.sample.subsys.usb.cdc_acm:
    harness: console
    harness_config:
      type: one_line
      regex:
      - Wait for DTR
    tags:
    - hpmicro_verified
    - usbd
    depends_on:
    - usbd
    required_snippets:
    - cdc_acm
    platform_allow: &platforms
    - hpm5100evk
    - hpm5300evk
    - hpm5301evklite
    - hpm5e00evk
    - hpm6200evk
    - hpm6300evk
    - hpm6750evk2
    - hpm6800evk
    - hpm6e00evk
    - hpm6p00evk
    integration_platforms: *platforms
