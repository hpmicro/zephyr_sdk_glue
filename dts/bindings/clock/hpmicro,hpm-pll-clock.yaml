description: |
  HPMicro PLL version 1. PLLv1 supports two modes:
  integer division mode, fraction division mode
  Output frequency is given by the following formula:
    integer: Fout = Fref / REFDIV * FBDIV_INT /POSDIV
    fraction: Fout = Fref / REFDIV * (FBDIV_FRAC + (FRAC / 2^24)) / POSDIV

compatible: "hpmicro,hpm-pll-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  pll-frequency:
    type: int
    required: true
    description: |
      PLL frequency Hz

  pll-index:
    type: int
    required: true
    description: |
      PLL index
    enum:
      - 0
      - 1
      - 2
      - 3
      - 4

  integer-mode:
    type: boolean
    description: Use integer division mode instead of fractional division mode.

  "#clock-cells":
    const: 2

clock-cells:
  - clk-index
  - div

child-binding:
  description: |
    PLL division

  properties:
    src-name:
      type: int
      required: true
      description: |
        PLL divider node index

    div-i:
      type: int
      required: true
      description: |
        PLL divider index

    div-p:
      type: int
      required: true
      description: |
        PLL divider prescaler
