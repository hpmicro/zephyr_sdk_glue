# =============================================================================
# Docker Compose for Zephyr HPMicro Development (Local Mount Mode)
# =============================================================================
# Load the released image (toolchains are bundled in the image). The source
# trees (zephyr/sdk_glue/sdk_env/modules/bootloader) are bind-mounted
# into the container.
#
# QUICK START:
#   1. Load the image:  docker load -i zephyr_hpmicro-v0.8.0.tar
#   2. Start container:  docker compose up -d
#   3. Enter container:  docker compose exec zephyr bash
#   4. Build inside:     west build -p always -b hpm6750evk2 -S blinky zephyr/samples/basic/blinky
#   5. Flash:            west flash   (CMSIS-DAP probe must be connected)
# =============================================================================

services:
  zephyr:
    # ==========================================================================
    # Release image v0.8.0. Download/loading instructions are documented in
    # docs/source/en/starting/docker.rst and docs/source/zh/starting/docker.rst.
    # ==========================================================================
    image: zephyr_hpmicro:v0.8.0
    container_name: zephyr-hpmicro-v0.8.0
    hostname: docker

    # ==========================================================================
    # Volume Mounts (all source trees are mounted; the image has no source)
    # This file lives in sdk_glue/, so ".." is the ZSG workspace root.
    # ==========================================================================
    volumes:
      - ../zephyr:/home/User/zephyr_space/zephyr
      - ../sdk_env:/home/User/zephyr_space/sdk_env
      - ../modules:/home/User/zephyr_space/modules
      - ../bootloader:/home/User/zephyr_space/bootloader
      - .:/home/User/zephyr_space/sdk_glue

      # Mount USB for debugging (required for west flash)
      - /dev/bus/usb:/dev/bus/usb

      # Optional: persist build output across container restarts
      # - ./build:/home/User/zephyr_space/zephyr/build

      # Optional: enable the ZCC toolchain license (also requires
      # network_mode: host below). The ZCC license daemon lmd listens on
      # the host's 127.0.0.1:25422 and is unreachable from the container's
      # default bridge network; mount the host's .terapines config dir
      # (usually under the user's home).
      # - ${HOME}/.terapines:/home/User/.terapines

    # Companion to the ZCC license mount above; keep commented when ZCC
    # is not in use.
    # network_mode: host

    # ==========================================================================
    # Container Settings
    # ==========================================================================
    working_dir: /home/User/zephyr_space
    stdin_open: true
    tty: true

    # Privileged mode for USB device access (CMSIS-DAP debugger, etc.)
    privileged: true

    # Add user to dialout and plugdev groups for serial access
    group_add:
      - dialout
      - plugdev

    # ==========================================================================
    # Environment Variables (same as the image defaults; override here)
    # ==========================================================================
    environment:
      - WORKSPACE=/home/User/zephyr_space
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-1.0.1
      - ZEPHYR_SDK_VERSION=1.0.1

# =============================================================================
# Equivalent docker run command (when not using compose):
# =============================================================================
#
#   docker run -it --rm --privileged --hostname docker \
#     -v /path/to/ZSG/zephyr:/home/User/zephyr_space/zephyr \
#     -v /path/to/ZSG/sdk_glue:/home/User/zephyr_space/sdk_glue \
#     -v /path/to/ZSG/sdk_env:/home/User/zephyr_space/sdk_env \
#     -v /path/to/ZSG/modules:/home/User/zephyr_space/modules \
#     -v /path/to/ZSG/bootloader:/home/User/zephyr_space/bootloader \
#     -v /dev/bus/usb:/dev/bus/usb \
#     -w /home/User/zephyr_space \
#     zephyr_hpmicro:v0.8.0
#
# =============================================================================
# Verification inside the container:
#   west build -p always -b hpm5100evk  -S blinky zephyr/samples/basic/blinky
#   west build -p always -b hpm6750evk2 -S blinky zephyr/samples/basic/blinky
#
# Switch toolchain:
#   source ~/zephyr_space/use-zcc.sh         # ZCC (license required, see above)
#   source ~/zephyr_space/use-zephyr-sdk.sh  # zephyr-sdk (default)
# =============================================================================
