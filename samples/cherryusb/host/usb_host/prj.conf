CONFIG_STDOUT_CONSOLE=y

# CherryUSB host stack and HPM EHCI controller
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_HOST=y
CONFIG_CHERRYUSB_HOST_EHCI_HPM=y

# Enable the serial, HID, and MSC class drivers used by the local usb_host.c
CONFIG_CHERRYUSB_HOST_CDC_ACM=y
CONFIG_CHERRYUSB_HOST_HID=y
CONFIG_CHERRYUSB_HOST_MSC=y

# Mount the CherryUSB MSC disk through Zephyr's FatFS backend
CONFIG_LOG=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=2
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="USB0,USB1"

CONFIG_MAIN_STACK_SIZE=2048
# Allocate the hub thread and multiple HID threads during enumeration.
CONFIG_HEAP_MEM_POOL_SIZE=16384
