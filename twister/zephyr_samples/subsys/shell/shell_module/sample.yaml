sample:
  name: Shell Sample
tests:
  hpmicro.sample.subsys.shell.shell_module:
    min_ram: 40
    harness: shell
    tags:
      - hpmicro_verified
      - uart
    depends_on:
      - uart
    filter: CONFIG_SERIAL and dt_chosen_enabled("zephyr,shell-uart")
    required_snippets:
      - shell_module
    platform_allow: &platforms
      - hpm5100evk
      - hpm5300evk
      - hpm5301evklite
      - hpm5e00evk
      - hpm6200evk
      - hpm6300evk
      - hpm6750evk2
      - hpm6800evk
      - hpm6e00evk
      - hpm6p00evk
    integration_platforms: *platforms
