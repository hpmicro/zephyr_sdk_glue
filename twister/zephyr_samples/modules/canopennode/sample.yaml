sample:
  name: CANopenNode sample
tests:
  hpmicro.sample.modules.canopennode:
    modules:
    - canopennode
    harness: console
    harness_config:
      type: one_line
      regex:
      - (.*)CANopen stack initialized
    tags:
    - hpmicro_verified
    - can
    depends_on:
    - can
    filter: dt_chosen_enabled("zephyr,canbus")
    required_snippets:
    - canopennode
    platform_allow: &platforms
    - hpm5100evk
    - hpm5300evk
    - hpm5e00evk
    - hpm6200evk
    - hpm6300evk
    - hpm6750evk2
    - hpm6800evk
    - hpm6e00evk
    - hpm6p00evk
    integration_platforms: *platforms
