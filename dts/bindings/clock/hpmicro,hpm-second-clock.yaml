description: |
  HPMicro derived clock. The parent clock identifies the upstream clock node.

compatible: "hpmicro,hpm-second-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  node-name:
    type: int
    required: true
    description: |
      HPM SDK clock_name_t value for this derived clock node.

  clocks:
    required: true
    description: Parent PLL output and functional clock divider.

  "#clock-cells":
    const: 0
