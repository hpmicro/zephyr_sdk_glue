sample:
  name: HPMicro Kernel Cache API test
tests:
  hpmicro.test.kernel.cache:
    tags:
      - hpmicro_verified
    filter: CONFIG_CACHE_MANAGEMENT
    required_snippets:
      - cache
    platform_allow: &platforms
      - hpm5100evk
      - hpm5300evk
      - hpm5301evklite
      - hpm5e00evk
      - hpm6200evk
      - hpm6300evk
      - hpm6750evk2
      - hpm6800evk
      - hpm6e00evk
      - hpm6p00evk
    integration_platforms: *platforms
