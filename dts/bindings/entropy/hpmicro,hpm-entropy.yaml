description: HPMicro HPM RNG

compatible: "hpmicro,hpm-rng"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clk-name:
    type: int
    required: true
    description: RNG clock name

  clk-source:
    type: int
    required: true
    description: RNG clock source

  clk-divider:
    type: int
    required: true
    description: RNG clock divider


