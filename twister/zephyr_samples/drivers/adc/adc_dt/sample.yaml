sample:
  name: ADC devicetree driver sample (HPMicro)
tests:
  hpmicro.sample.drivers.adc.adc_dt:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
      - 'ADC reading\[\d+\]:'
      - '- .+, channel \d+: -?\d+'
    tags:
    - hpmicro_verified
    - adc
    depends_on:
    - adc
    filter: dt_node_has_prop("/zephyr,user","io-channels")
    required_snippets:
    - adc_dt
    platform_allow: &platforms
    - hpm5100evk
    - hpm5300evk
    - hpm5301evklite
    - hpm5e00evk
    - hpm6200evk
    - hpm6300evk
    - hpm6750evk2
    - hpm6800evk
    - hpm6e00evk
    - hpm6p00evk
    integration_platforms: *platforms
